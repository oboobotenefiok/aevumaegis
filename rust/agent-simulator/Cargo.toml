[package]
name = "aevumaegis-agent-simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aevumaegis-agent"
path = "src/main.rs"

[dependencies]
alloy = { version = "2.5.0", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5"
