[package]
name = "aevumaegis-forensic-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aevumaegis-verify"
path = "src/main.rs"

[dependencies]
alloy-primitives = "1.4"
alloy-sol-types = "1.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"
