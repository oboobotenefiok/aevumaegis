[package]
name = "aevumaegis-forensic-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aevumaegis-verify"
path = "src/main.rs"

[dependencies]
alloy = { version = "2.5.0", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "time"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.14"
